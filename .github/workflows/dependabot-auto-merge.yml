name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's minor and patch PRs. GitHub merges one only after the
# main ruleset's required `check` passes, so a bump that breaks the build stays open.
# Major bumps are left for a human. Merging deploys: Workers Builds and Vercel build every push to main.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # An unknown update type is treated like a major one.
      - if: contains(fromJSON('["version-update:semver-minor","version-update:semver-patch"]'), steps.meta.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
