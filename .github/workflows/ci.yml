name: CI

# Runs on every pull request and on main. Never calls the real Anthropic API:
# no key exists here, the E2E tests switch AI narration off, and the live tests
# (npm run test:live) are not part of this workflow.
# Deploys are not done here: Cloudflare Workers Builds deploys the Worker and Vercel deploys
# the frontend, each from its own Git integration, so no deploy secret lives in GitHub.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs cancel an older run; every merge to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19; try 26 deliberately (TODOS.md), not by surprise.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      # The Worker runs on workerd and has its own tsconfig, so the root check does not see it.
      - run: npx tsc --noEmit -p worker
      - run: npx eslint
      - run: npm test
      # Builds, then fails if any question or answer text is in the browser bundle.
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

