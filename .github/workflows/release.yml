name: Release

# A version bump to X.Y.0.0 (MINOR or MAJOR) on main becomes tag vX.Y.0.0 and a GitHub
# Release whose notes are every CHANGELOG section since the previous release. Smaller versions
# (hotfixes) wait for the next one, or are released by hand: Actions → Release → Run workflow
# releases main's current VERSION. stamp.yml calls this after it bumps the version, because a
# push made with the workflow token starts no other workflow.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to release (stamp.yml's release commit)
        required: true
        type: string

permissions:
  contents: read

# One group per commit: almost every merge now changes VERSION, and a shared group would let a newer queued run
# cancel a pending X.Y.0.0 release. The "already released" check below keeps reruns harmless.
concurrency:
  group: release-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # The only job that may write: it pushes the tag and creates the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Tag and release VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$EVENT" = push ] && ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.0\.0$ ]]; then
            echo "v$version is not a MINOR or MAJOR version; release it by hand if it should have its own release."
            exit 0
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released."
            exit 0
          fi
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+(\.[0-9]+){3}$' | grep -vxF "v$version" | head -1 || true)
          if [ -z "$previous" ]; then
            # Without a previous release the notes would be the whole CHANGELOG.
            echo "No release tags yet: publish the historical releases first, then run this workflow by hand."
            exit 1
          fi
          node scripts/release-notes.ts "$version" "${previous#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" --target "$(git rev-parse HEAD)" --title "v$version" --notes-file "$RUNNER_TEMP/notes.md"
