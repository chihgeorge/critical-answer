version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Minor/patch PRs merge themselves once CI passes (dependabot-auto-merge.yml). Waiting 5 days
    # after a release skips versions that get pulled for being broken or compromised. Security
    # updates are not delayed.
    cooldown:
      default-days: 5
    # One PR for all minor/patch bumps; majors still get their own PR.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # eslint-config-next's typescript-eslint rejects TS >=6.1 and its eslint-plugin-react crashes on ESLint 10; see TODOS.md.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "eslint"
        versions: [">=10"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
